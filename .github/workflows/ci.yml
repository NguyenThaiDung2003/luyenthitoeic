name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: toeic
          # Mật khẩu chỉ dùng cho CSDL tạm trong CI
          POSTGRES_PASSWORD: toeic_ci
          POSTGRES_DB: toeic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toeic -d toeic_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://toeic:toeic_ci@localhost:5432/toeic_test
      TEST_DATABASE_URL: postgresql://toeic:toeic_ci@localhost:5432/toeic_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
