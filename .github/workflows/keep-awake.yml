name: Giữ backend thức

# Render gói miễn phí cho backend ngủ khi không có truy cập, nên gọi health định kỳ
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: >-
          curl --fail --silent --show-error --output /dev/null
          --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors
          https://luyenthitoeic-backend.onrender.com/api/health
